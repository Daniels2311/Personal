<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo ✨</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importamos Three.js y OrbitControls para el movimiento de la cámara -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 1. PANTALLA DE INICIO (Se desvanece al dar clic en Explorar) -->
    <div id="pantalla-bienvenida">
        <div class="contenido-bienvenida">
            <h1 class="titulo-intro">NUESTRO UNIVERSO</h1>
            <p class="frase-intro">"Mientras otros solo reaccionan historias..."</p>
            <p class="frase-sub">yo te programé un universo ❤️</p>
            <button id="btn-explorar">EXPLORAR</button>
        </div>
    </div>

    <!-- 2. LIENZO 3D (Se revela al explorar) -->
    <canvas id="universo-canvas"></canvas>

    <!-- Letrero flotante de instrucciones en el universo -->
    <div id="instrucciones" class="oculto">
        <p>Arrastra para girar, usa el zoom y haz clic en los mundos brillantes ✨</p>
    </div>

    <!-- 3. MODAL PARA TUS MENSAJES E IMÁGENES -->
    <div id="modal-recuerdo" class="modal-oculto">
        <div class="modal-contenido">
            <span id="cerrar-modal">&times;</span>
            <img id="modal-imagen" src="" alt="Nuestro Recuerdo">
            <h2 id="modal-titulo">Título del Recuerdo</h2>
            <p id="modal-descripcion">Aquí va el mensaje especial...</p>
        </div>
    </div>

    <!-- Tu archivo de lógica -->
    <script src="script.js"></script>
</body>
</html>
